tunnel: t4host
# credentials-file: ~/.cloudflared/<TUNNEL_ID>.json  # omitted in token mode (startup.py writes real path when --token not used)
ingress:
  - hostname: ai.yourdomain.com
    service: http://localhost:1234
  - hostname: oc.yourdomain.com
    service: http://localhost:2456
  - hostname: chamber.yourdomain.com
    service: http://localhost:3000
  - hostname: ssh.yourdomain.com
    service: ssh://localhost:22
  - service: http_status:404
